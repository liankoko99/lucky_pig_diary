<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#B4E082">
    <title>lucky pig pig</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        :root { --ink: #1A1A1A; --bg: #B4E082; }
        body { background-color: var(--bg); font-family: 'Zen Maru Gothic', sans-serif; color: var(--ink); margin: 0; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        textarea, input { -webkit-user-select: auto; user-select: auto; }
        .hand-drawn-border { border: 3px solid var(--ink); border-radius: 25px 15px 25px 15px / 15px 25px 15px 25px; }
        .calendar-grid-button { border: 2px solid var(--ink); box-shadow: 2px 2px 0px var(--ink); transition: all 0.2s ease; }
        .calendar-grid-button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--ink); }
        .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const PenToolIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>;
        const ChevronLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
        const ChevronRightIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
        const ArrowLeftIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>;
        const SaveIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>;
        const ShareIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;

        const COLORS = { catBlack: '#333333', catWhite: '#FFFFFF', catOrange: '#E89D45', catGrey: '#888888', ink: '#1A1A1A' };

        const ImageCats = () => (
            <div className="relative mt-8">
                <div className="grid grid-cols-3 gap-4 opacity-90 relative z-10">
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,30 50,30 T80,60 Z" fill={COLORS.catBlack} /><path d="M35,35 L30,15 L45,30" fill={COLORS.catBlack} /><path d="M65,35 L70,15 L55,30" fill={COLORS.catBlack} /><circle cx="40" cy="45" r="1.5" fill="white" /><circle cx="60" cy="45" r="1.5" fill="white" /><path d="M15,50 L5,48 M15,55 L5,58" stroke="white" strokeWidth="1" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 120 80" className="w-20 h-12"><path d="M20,60 Q40,30 60,30 T100,60 Z" fill={COLORS.catWhite} /><path d="M70,30 Q85,35 95,50 L100,60 L60,60 Z" fill={COLORS.catOrange} /><path d="M25,45 Q35,35 45,40" fill={COLORS.catBlack} /><path d="M30,35 L25,15 L40,30" fill={COLORS.catBlack} /><path d="M55,32 L60,12 L65,30" fill={COLORS.catOrange} /><circle cx="35" cy="45" r="1.5" fill={COLORS.ink} /><circle cx="55" cy="45" r="1.5" fill={COLORS.ink} /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M10,60 Q30,40 50,40 T90,60 Z" fill={COLORS.catWhite} /><path d="M35,42 L32,25 L45,40" fill={COLORS.catWhite} /><path d="M65,42 L68,25 L55,40" fill={COLORS.catWhite} /><path d="M40,50 Q50,55 60,50" stroke={COLORS.ink} fill="none" strokeWidth="1" /><circle cx="38" cy="48" r="1" fill={COLORS.ink} /><circle cx="62" cy="48" r="1" fill={COLORS.ink} /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,35 50,35 T80,60 Z" fill={COLORS.catBlack} /><path d="M35,38 L30,18 L45,35" fill={COLORS.catBlack} /><path d="M65,38 L70,18 L55,35" fill={COLORS.catBlack} /><circle cx="50" cy="50" r="4" fill="white" /><path d="M48,50 L42,50 M52,50 L58,50" stroke="white" strokeWidth="1" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,35 50,35 T80,60 Z" fill={COLORS.catGrey} /><path d="M25,45 L15,15 L85,15 L75,45" fill="rgba(255,255,255,0.4)" stroke={COLORS.ink} strokeWidth="1" /><path d="M45,45 L40,30 L55,45" fill={COLORS.catGrey} /><path d="M55,45 L60,30 L65,45" fill={COLORS.catGrey} /><circle cx="45" cy="52" r="1" fill="white" /><circle cx="55" cy="52" r="1" fill="white" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 120 80" className="w-20 h-12"><path d="M20,60 Q40,35 60,35 T100,60 Z" fill={COLORS.catOrange} /><path d="M30,40 L30,55 M40,35 L40,50 M50,35 L50,50" stroke="#C87B2D" strokeWidth="2" /><path d="M35,38 L30,18 L45,35" fill={COLORS.catOrange} /><path d="M65,38 L70,18 L55,35" fill={COLORS.catOrange} /><circle cx="45" cy="50" r="1.5" fill={COLORS.ink} /><circle cx="65" cy="50" r="1.5" fill={COLORS.ink} /><path d="M55,55 Q55,58 52,55" fill="none" stroke={COLORS.ink} strokeWidth="1" /></svg></div>
                </div>
            </div>
        );

        function CalendarView({ entries, currentDate, setCurrentDate, onSelectDate }) {
            const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let d = 1; d <= daysInMonth; d++) days.push(new Date(year, month, d));

            return (
                <div className="px-2">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-[#1A1A1A]">{year} <span className="text-[#1A1A1A]/40 mx-0.5">/</span> {monthNames[month]}</h2>
                        <div className="flex gap-3">
                            <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="w-10 h-10 border-2 border-[#1A1A1A] bg-white rounded-full flex items-center justify-center shadow-[2px_2px_0px_#1A1A1A] active:translate-y-0.5"><ChevronLeftIcon /></button>
                            <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="w-10 h-10 border-2 border-[#1A1A1A] bg-white rounded-full flex items-center justify-center shadow-[2px_2px_0px_#1A1A1A] active:translate-y-0.5"><ChevronRightIcon /></button>
                        </div>
                    </div>
                    <div className="grid grid-cols-7 gap-2">
                        {['日', '一', '二', '三', '四', '五', '六'].map(d => <div key={d} className="text-center text-[11px] font-bold text-[#1A1A1A]/60 mb-2">{d}</div>)}
                        {days.map((date, idx) => {
                            if (!date) return <div key={`empty-${idx}`} />;
                            const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                            const dayData = entries[dateStr] || {};
                            const hasData = (dayData.pigpig?.some(i => i.trim() !== '')) || (dayData.bingbing?.some(i => i.trim() !== ''));

                            return (
                                <button
                                    key={dateStr}
                                    onClick={() => onSelectDate(dateStr)}
                                    className={`aspect-square rounded-lg flex items-center justify-center text-sm font-bold calendar-grid-button ${hasData ? 'bg-[#1A1A1A] text-white' : 'bg-white/40 text-[#1A1A1A] border-white/40'}`}
                                    style={{ borderRadius: `${Math.random() * 6 + 4}px` }}
                                >{date.getDate()}</button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function EntryView({ date, existingData, onBack }) {
            const defaultData = { pigpig: ['', '', ''], bingbing: ['', '', ''] };
            const [data, setData] = useState(existingData || defaultData);

            const EntrySection = ({ user, label, emoji, bgColor }) => (
                <div className={`p-4 border-2 border-[#1A1A1A] rounded-2xl shadow-[4px_4px_0px_#1A1A1A] mb-6 ${bgColor}`} style={{ borderRadius: '20px 10px 20px 10px' }}>
                    <div className="flex items-center gap-2 mb-3">
                        <span className="text-xl">{emoji}</span>
                        <h3 className="font-bold text-lg">{label} 的小確幸</h3>
                    </div>
                    <div className="space-y-3">
                        {[0, 1, 2].map(i => (
                            <textarea
                                key={i}
                                value={data[user][i]}
                                placeholder="分享你的小確幸..."
                                className="w-full bg-white/80 border border-[#1A1A1A]/20 p-2 rounded-lg focus:outline-none text-sm min-h-[60px] resize-none"
                                readOnly
                            />
                        ))}
                    </div>
                </div>
            );

            return (
                <div className="animate-slide-in pb-10">
                    <div className="flex justify-between items-center mb-4">
                        <button onClick={onBack} className="flex items-center gap-1 text-sm font-bold text-[#1A1A1A]/70 py-2"><ArrowLeftIcon /> 返回月曆</button>
                        <div className="text-[11px] font-black text-[#1A1A1A] bg-white px-2 py-1 rounded shadow-sm">{date.replace(/-/g, ' . ')}</div>
                    </div>

                    <div className="custom-scroll overflow-y-auto max-h-[60vh] pr-1">
                        <EntrySection user="pigpig" label="豬豬" emoji="🐷" bgColor="bg-pink-100/30" />
                        <EntrySection user="bingbing" label="餅餅" emoji="🍪" bgColor="bg-yellow-100/30" />
                        <div className="mt-8 border-t border-dashed border-[#1A1A1A]/20 pt-8">
                            <div className="text-center text-[10px] font-bold text-[#1A1A1A]/40 mb-6 tracking-widest uppercase">lucky cat cat</div>
                            <ImageCats />
                        </div>
                    </div>

                    <div className="mt-4">
                        <button className="w-full py-4 rounded-xl border-2 border-[#1A1A1A] font-bold text-lg flex items-center justify-center gap-2 transition-all bg-white shadow-[4px_4px_0px_#1A1A1A] active:translate-y-1 active:shadow-none">
                            <SaveIcon /> 儲存兩人的內容
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('calendar');
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState('');
            // 假資料用作預覽顯示
            const mockEntries = {};

            return (
                <div className="min-h-screen flex justify-center p-3 sm:p-8 relative">
                    <div className="w-full max-w-lg min-h-[92vh] hand-drawn-border relative overflow-hidden flex flex-col p-5 bg-[#B4E082] shadow-[10px_10px_0px_rgba(0,0,0,0.15)]">
                        <header className="mb-6 relative z-10 flex justify-between items-start">
                            <div>
                                <div className="flex items-center gap-2 mb-1">
                                    <div className="p-1.5 bg-[#1A1A1A] rounded-full text-white"><PenToolIcon /></div>
                                    <span className="text-[10px] font-bold uppercase opacity-50">lucky pig pig</span>
                                </div>
                                <h1 className="text-2xl font-bold text-[#1A1A1A]">{view === 'calendar' ? '感恩日記' : '今日小確幸'}</h1>
                            </div>
                            <button className="px-3 py-1.5 rounded-full border-2 border-[#1A1A1A] font-bold text-[10px] shadow-[2px_2px_0px_#1A1A1A] bg-white">
                                <ShareIcon /> 邀請連線
                            </button>
                        </header>
                        <main className="flex-1 z-10 overflow-hidden">
                            {view === 'calendar' ? <CalendarView entries={mockEntries} currentDate={currentDate} setCurrentDate={setCurrentDate} onSelectDate={(d) => { setSelectedDate(d); setView('entry'); }} /> : <EntryView date={selectedDate} existingData={mockEntries[selectedDate]} onBack={() => setView('calendar')} />}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
