<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#B4E082">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>lucky pig pig</title>
    
    <!-- Firebase Import Map (必須放在前面) -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');

        :root {
            --ink: #1A1A1A;
            --paper: #B4E082;
            --bg: #B4E082;
            --text-light: #F9F8F4;
        }

        body {
            background-color: var(--bg);
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--ink);
            margin: 0;
            transition: background-color 0.5s ease;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        textarea, input {
            -webkit-user-select: auto;
            user-select: auto;
        }

        .hand-drawn-border {
            border: 3px solid var(--ink);
            border-radius: 25px 15px 25px 15px / 15px 25px 15px 25px;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.1;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .calendar-grid-button {
            border: 2px solid var(--ink);
            box-shadow: 2px 2px 0px var(--ink);
            transition: all 0.2s ease;
        }
        .calendar-grid-button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--ink);
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';

        const { useState, useEffect } = React;

        // --- Firebase 初始化設定 ---
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'lucky-pig-diary';
        
        try {
            const firebaseConfig = typeof __firebase_config !== 'undefined' 
                ? JSON.parse(__firebase_config) 
                : { projectId: "demo-project" }; // 備用配置，實際環境由系統注入
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase init error", e);
        }

        // --- 圖示組件 ---
        const PenToolIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        );
        const ChevronLeftIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        );
        const ChevronRightIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        );
        const ArrowLeftIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        );
        const SaveIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        );
        const ShareIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        );
        const LinkIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        );

        const COLORS = {
            catBlack: '#333333',
            catWhite: '#FFFFFF',
            catOrange: '#E89D45',
            catGrey: '#888888',
            ink: '#1A1A1A'
        };

        const ImageCats = () => (
            <div className="relative mt-8">
                <div className="grid grid-cols-3 gap-4 opacity-90 relative z-10">
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,30 50,30 T80,60 Z" fill={COLORS.catBlack} /><path d="M35,35 L30,15 L45,30" fill={COLORS.catBlack} /><path d="M65,35 L70,15 L55,30" fill={COLORS.catBlack} /><circle cx="40" cy="45" r="1.5" fill="white" /><circle cx="60" cy="45" r="1.5" fill="white" /><path d="M15,50 L5,48 M15,55 L5,58" stroke="white" strokeWidth="1" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 120 80" className="w-20 h-12"><path d="M20,60 Q40,30 60,30 T100,60 Z" fill={COLORS.catWhite} /><path d="M70,30 Q85,35 95,50 L100,60 L60,60 Z" fill={COLORS.catOrange} /><path d="M25,45 Q35,35 45,40" fill={COLORS.catBlack} /><path d="M30,35 L25,15 L40,30" fill={COLORS.catBlack} /><path d="M55,32 L60,12 L65,30" fill={COLORS.catOrange} /><circle cx="35" cy="45" r="1.5" fill={COLORS.ink} /><circle cx="55" cy="45" r="1.5" fill={COLORS.ink} /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M10,60 Q30,40 50,40 T90,60 Z" fill={COLORS.catWhite} /><path d="M35,42 L32,25 L45,40" fill={COLORS.catWhite} /><path d="M65,42 L68,25 L55,40" fill={COLORS.catWhite} /><path d="M40,50 Q50,55 60,50" stroke={COLORS.ink} fill="none" strokeWidth="1" /><circle cx="38" cy="48" r="1" fill={COLORS.ink} /><circle cx="62" cy="48" r="1" fill={COLORS.ink} /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,35 50,35 T80,60 Z" fill={COLORS.catBlack} /><path d="M35,38 L30,18 L45,35" fill={COLORS.catBlack} /><path d="M65,38 L70,18 L55,35" fill={COLORS.catBlack} /><circle cx="50" cy="50" r="4" fill="white" /><path d="M48,50 L42,50 M52,50 L58,50" stroke="white" strokeWidth="1" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 100 80" className="w-16 h-12"><path d="M20,60 Q20,35 50,35 T80,60 Z" fill={COLORS.catGrey} /><path d="M25,45 L15,15 L85,15 L75,45" fill="rgba(255,255,255,0.4)" stroke={COLORS.ink} strokeWidth="1" /><path d="M45,45 L40,30 L55,45" fill={COLORS.catGrey} /><path d="M55,45 L60,30 L65,45" fill={COLORS.catGrey} /><circle cx="45" cy="52" r="1" fill="white" /><circle cx="55" cy="52" r="1" fill="white" /></svg></div>
                    <div className="flex justify-center"><svg viewBox="0 0 120 80" className="w-20 h-12"><path d="M20,60 Q40,35 60,35 T100,60 Z" fill={COLORS.catOrange} /><path d="M30,40 L30,55 M40,35 L40,50 M50,35 L50,50" stroke="#C87B2D" strokeWidth="2" /><path d="M35,38 L30,18 L45,35" fill={COLORS.catOrange} /><path d="M65,38 L70,18 L55,35" fill={COLORS.catOrange} /><circle cx="45" cy="50" r="1.5" fill={COLORS.ink} /><circle cx="65" cy="50" r="1.5" fill={COLORS.ink} /><path d="M55,55 Q55,58 52,55" fill="none" stroke={COLORS.ink} strokeWidth="1" /></svg></div>
                </div>
            </div>
        );

        function CalendarView({ entries, currentDate, setCurrentDate, onSelectDate }) {
            const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();
            
            const days = [];
            for (let i = 0; i < firstDay; i++) days.push(null);
            for (let d = 1; d <= daysInMonth; d++) days.push(new Date(year, month, d));

            return (
                <div className="animate-fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-xl font-bold text-[#1A1A1A]">
                            {year} <span className="text-[#1A1A1A]/40 mx-0.5">/</span> {monthNames[month]}
                        </h2>
                        <div className="flex gap-3">
                            <button onClick={() => setCurrentDate(new Date(year, month - 1, 1))} className="w-10 h-10 border-2 border-[#1A1A1A] bg-white rounded-full flex items-center justify-center hover:bg-[#FCF5CA] active:scale-95 transition-all shadow-[2px_2px_0px_#1A1A1A]">
                                <ChevronLeftIcon />
                            </button>
                            <button onClick={() => setCurrentDate(new Date(year, month + 1, 1))} className="w-10 h-10 border-2 border-[#1A1A1A] bg-white rounded-full flex items-center justify-center hover:bg-[#FCF5CA] active:scale-95 transition-all shadow-[2px_2px_0px_#1A1A1A]">
                                <ChevronRightIcon />
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-7 gap-2">
                        {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                            <div key={d} className="text-center text-[11px] font-bold text-[#1A1A1A]/60 mb-2">{d}</div>
                        ))}
                        {days.map((date, idx) => {
                            if (!date) return <div key={`empty-${idx}`} />;
                            const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                            const hasData = entries[dateStr] && entries[dateStr].filter(i => i.trim() !== '').length > 0;

                            return (
                                <button
                                    key={dateStr}
                                    onClick={() => onSelectDate(dateStr)}
                                    className={`aspect-square rounded-lg flex items-center justify-center text-sm font-bold calendar-grid-button ${hasData ? 'bg-[#1A1A1A] text-white' : 'bg-white/40 text-[#1A1A1A] border-white/40'}`}
                                    style={{ borderRadius: `${Math.random() * 6 + 4}px` }}
                                >
                                    {date.getDate()}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function EntryView({ date, existingData, onBack, onSave }) {
            const [items, setItems] = useState(existingData || ['', '', '']);
            const [saved, setSaved] = useState(false);

            useEffect(() => {
                setItems(existingData || ['', '', '']);
            }, [existingData]);

            const handleChange = (idx, val) => {
                const newItems = [...items];
                newItems[idx] = val;
                setItems(newItems);
                setSaved(false);
            };

            const isComplete = items.filter(i => i.trim() !== '').length >= 1;

            const handleSaveClick = () => {
                onSave(items);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            return (
                <div className="animate-slide-in pb-12">
                    <button onClick={onBack} className="flex items-center gap-1 text-sm font-bold mb-4 text-[#1A1A1A]/70 active:text-[#1A1A1A] transition-opacity py-2">
                        <ArrowLeftIcon /> 返回月曆
                    </button>

                    <div className="mb-6 flex justify-between items-end">
                        <div>
                            <div className="text-[11px] font-black text-[#1A1A1A] bg-white px-2 py-1 inline-block mb-2 rounded shadow-sm">
                                {date.replace(/-/g, ' . ')}
                            </div>
                            <h2 className="text-lg font-bold text-[#1A1A1A]">今天感恩的3件事：</h2>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {[0, 1, 2].map(i => (
                            <div key={i} className="relative">
                                <textarea
                                    value={items[i]}
                                    onChange={(e) => handleChange(i, e.target.value)}
                                    placeholder="紀錄一點小確幸..."
                                    className="w-full bg-white border-2 border-[#1A1A1A] p-4 rounded-xl focus:outline-none shadow-[3px_3px_0px_#1A1A1A] min-h-[90px] text-base leading-relaxed resize-none transition-all focus:shadow-[5px_5px_0px_#1A1A1A]"
                                    style={{ borderRadius: '15px 25px 15px 25px' }}
                                />
                            </div>
                        ))}
                    </div>

                    <div className="mt-8">
                        <button
                            disabled={!isComplete}
                            onClick={handleSaveClick}
                            className={`w-full py-4 rounded-xl border-2 border-[#1A1A1A] font-bold text-lg flex items-center justify-center gap-2 transition-all ${isComplete ? 'bg-white text-[#1A1A1A] shadow-[4px_4px_0px_#1A1A1A] active:translate-x-1 active:translate-y-1 active:shadow-none' : 'bg-white/40 text-[#1A1A1A]/40 border-white/40'}`}
                        >
                            <SaveIcon />
                            {saved ? '已儲存同步！' : '儲存3份小確幸'}
                        </button>
                    </div>

                    <div className="mt-16 border-t border-dashed border-[#1A1A1A]/20 pt-10">
                        <div className="text-center text-[10px] font-bold text-[#1A1A1A]/40 mb-6 tracking-widest uppercase">
                            lucky cat cat
                        </div>
                        <ImageCats />
                    </div>
                </div>
            );
        }

        function ShareView({ roomId, setRoomId, onBack }) {
            const [inputCode, setInputCode] = useState('');
            const [localError, setLocalError] = useState('');

            const handleCreate = () => {
                const code = Math.random().toString(36).substring(2, 7).toUpperCase();
                setRoomId(code);
                localStorage.setItem('gratitude_room_id', code);
            };

            const handleJoin = () => {
                if (inputCode.trim().length >= 4) {
                    const code = inputCode.trim().toUpperCase();
                    setRoomId(code);
                    localStorage.setItem('gratitude_room_id', code);
                    setLocalError('');
                } else {
                    setLocalError('分享碼過短');
                }
            };

            const handleDisconnect = () => {
                setRoomId('');
                localStorage.removeItem('gratitude_room_id');
            };

            return (
                <div className="animate-slide-in pb-12">
                    <button onClick={onBack} className="flex items-center gap-1 text-sm font-bold mb-8 text-[#1A1A1A]/70 active:text-[#1A1A1A] transition-opacity py-2">
                        <ArrowLeftIcon /> 返回
                    </button>

                    <div className="text-center mb-8">
                        <div className="inline-flex items-center justify-center w-16 h-16 bg-white border-4 border-[#1A1A1A] rounded-full shadow-[4px_4px_0px_#1A1A1A] mb-4">
                            <LinkIcon />
                        </div>
                        <h2 className="text-xl font-bold text-[#1A1A1A] mb-2">交換日記連線</h2>
                        <p className="text-sm text-[#1A1A1A]/70 font-bold leading-relaxed">
                            與重要的人共享這本日記，<br/>雙方都能看見彼此寫下的美好。
                        </p>
                    </div>

                    {roomId ? (
                        <div className="bg-white border-2 border-[#1A1A1A] p-6 rounded-2xl shadow-[6px_6px_0px_#1A1A1A] text-center" style={{ borderRadius: '25px 15px 25px 15px' }}>
                            <div className="text-sm font-bold text-[#1A1A1A]/50 mb-2">目前連線的專屬分享碼：</div>
                            <div className="text-4xl font-black text-[#E89D45] tracking-widest mb-6">{roomId}</div>
                            <p className="text-xs font-bold text-[#1A1A1A]/60 mb-6 bg-[#FCF5CA] inline-block px-3 py-1 rounded">請對方在他們的手機輸入此碼</p>
                            
                            <button
                                onClick={handleDisconnect}
                                className="w-full py-3 rounded-xl border-2 border-[#1A1A1A] font-bold text-[#1A1A1A] bg-white/50 hover:bg-[#F8D0D3] transition-all shadow-[3px_3px_0px_#1A1A1A] active:translate-x-1 active:translate-y-1 active:shadow-none"
                            >
                                斷開連線 (恢復單機)
                            </button>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <button
                                onClick={handleCreate}
                                className="w-full py-4 rounded-xl border-2 border-[#1A1A1A] font-bold text-lg bg-white text-[#1A1A1A] shadow-[4px_4px_0px_#1A1A1A] active:translate-x-1 active:translate-y-1 active:shadow-none"
                            >
                                創建專屬分享碼
                            </button>
                            
                            <div className="flex items-center justify-center gap-4 py-2">
                                <div className="h-[2px] bg-[#1A1A1A]/20 flex-1"></div>
                                <span className="text-xs font-bold text-[#1A1A1A]/50 uppercase tracking-widest">OR</span>
                                <div className="h-[2px] bg-[#1A1A1A]/20 flex-1"></div>
                            </div>

                            <div className="space-y-3">
                                <label className="text-sm font-bold text-[#1A1A1A]">輸入朋友的分享碼：</label>
                                <input
                                    type="text"
                                    value={inputCode}
                                    onChange={(e) => setInputCode(e.target.value)}
                                    placeholder="例如：PIG123"
                                    className="w-full bg-white border-2 border-[#1A1A1A] p-4 rounded-xl focus:outline-none shadow-[3px_3px_0px_#1A1A1A] font-bold uppercase"
                                />
                                {localError && <div className="text-red-600 font-bold text-sm">{localError}</div>}
                                <button
                                    onClick={handleJoin}
                                    className="w-full py-4 rounded-xl border-2 border-[#1A1A1A] font-bold text-lg bg-[#FCF5CA] text-[#1A1A1A] shadow-[4px_4px_0px_#1A1A1A] active:translate-x-1 active:translate-y-1 active:shadow-none"
                                >
                                    加入日記
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function App() {
            const [view, setView] = useState('calendar'); // 'calendar', 'entry', 'share'
            const [user, setUser] = useState(null);
            const [roomId, setRoomId] = useState(() => localStorage.getItem('gratitude_room_id') || '');
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('gratitude_entries');
                return saved ? JSON.parse(saved) : {};
            });
            const [isSyncing, setIsSyncing] = useState(false);
            
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(() => {
                const today = new Date();
                return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            });

            // 1. 處理 Firebase 匿名登入
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth error", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. 處理資料同步 (如果設定了 roomId)
            useEffect(() => {
                if (!user) return;
                
                if (roomId) {
                    setIsSyncing(true);
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_diaries', roomId);
                    
                    const unsubscribe = onSnapshot(docRef, (docSnap) => {
                        if (docSnap.exists()) {
                            const cloudData = docSnap.data().entries || {};
                            setEntries(cloudData);
                            localStorage.setItem('gratitude_entries', JSON.stringify(cloudData));
                        } else {
                            // 如果這個分享碼還沒有資料，就建立它
                            setDoc(docRef, { entries: {} }, { merge: true });
                        }
                        setIsSyncing(false);
                    }, (error) => {
                        console.error("Sync error:", error);
                        setIsSyncing(false);
                    });
                    
                    return () => unsubscribe();
                } else {
                    // 單機模式：讀取本地資料
                    const saved = localStorage.getItem('gratitude_entries');
                    if (saved) setEntries(JSON.parse(saved));
                }
            }, [user, roomId]);

            const handleSave = async (date, data) => {
                const newEntries = { ...entries, [date]: data };
                setEntries(newEntries); // 畫面先即時更新
                
                // 單機儲存
                localStorage.setItem('gratitude_entries', JSON.stringify(newEntries));

                // 雲端儲存
                if (roomId && user) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'shared_diaries', roomId);
                        await setDoc(docRef, { entries: newEntries }, { merge: true });
                    } catch (err) {
                        console.error("Cloud save failed", err);
                    }
                }
            };

            return (
                <div className="min-h-screen flex justify-center p-3 sm:p-8 relative">
                    <div className="noise-overlay" />
                    <div className="w-full max-w-lg min-h-[90vh] hand-drawn-border relative overflow-hidden flex flex-col p-5 sm:p-10 shadow-[10px_10px_0px_rgba(0,0,0,0.15)] bg-[#B4E082]">
                        <header className="mb-6 relative z-10 flex justify-between items-start">
                            <div>
                                <div className="flex items-center gap-2 mb-2">
                                    <div className="p-1.5 bg-[#1A1A1A] rounded-full text-white">
                                        <PenToolIcon />
                                    </div>
                                    <span className="text-[11px] font-bold tracking-[0.2em] uppercase text-[#1A1A1A]/60">lucky pig pig</span>
                                </div>
                                <h1 className="text-3xl font-bold tracking-tight text-[#1A1A1A]">
                                    {view === 'calendar' ? '感恩日記' : view === 'share' ? '交換日記' : '今日小確幸'}
                                </h1>
                            </div>
                            
                            {/* 連線按鈕 / 狀態列 */}
                            <button 
                                onClick={() => setView('share')}
                                className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full border-2 border-[#1A1A1A] font-bold text-[10px] transition-all shadow-[2px_2px_0px_#1A1A1A] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none ${roomId ? 'bg-[#FCF5CA] text-[#1A1A1A]' : 'bg-white text-[#1A1A1A]/60'}`}
                            >
                                <ShareIcon />
                                {roomId ? '已連線' : '邀請朋友'}
                            </button>
                        </header>

                        <main className="flex-1 z-10 overflow-y-auto overflow-x-hidden pb-4">
                            {view === 'calendar' ? (
                                <CalendarView entries={entries} currentDate={currentDate} setCurrentDate={setCurrentDate} onSelectDate={(d) => { setSelectedDate(d); setView('entry'); }} />
                            ) : view === 'share' ? (
                                <ShareView roomId={roomId} setRoomId={setRoomId} onBack={() => setView('calendar')} />
                            ) : (
                                <EntryView date={selectedDate} existingData={entries[selectedDate]} onBack={() => setView('calendar')} onSave={(data) => handleSave(selectedDate, data)} />
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
