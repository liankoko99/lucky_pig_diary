<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7AC174">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>lucky pig pig</title>
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap');
        :root { --ink: #1A1A1A; --bg: #7AC174; }
        body { background-color: var(--bg); font-family: 'Zen Maru Gothic', sans-serif; color: var(--ink); margin: 0; overflow-x: hidden; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        textarea, input { -webkit-user-select: auto; user-select: auto; }
        .hand-drawn-container { border: 3px solid var(--ink); border-radius: 30px; box-shadow: 8px 8px 0px rgba(0,0,0,0.15); }
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.1; z-index: 9999; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }
        .calendar-grid-button { border: 2px solid var(--ink); box-shadow: 2px 2px 0px var(--ink); transition: all 0.2s ease; }
        .calendar-grid-button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--ink); }
        .textarea-shadow { box-shadow: 3px 3px 0px var(--ink); border: 2px solid var(--ink); transition: all 0.2s ease; }
        .textarea-shadow:focus { box-shadow: 5px 5px 0px var(--ink); outline: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
        .cat-item-box { width: 58px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .cat-svg-core { width: 100%; height: 100%; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, doc, setDoc, onSnapshot } from 'firebase/firestore';

        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBXQd28R5f6P78DxhIgcG3JrRIRAmSMrns",
            authDomain: "lucky-pig-diary.firebaseapp.com",
            projectId: "lucky-pig-diary",
            storageBucket: "lucky-pig-diary.firebasestorage.app",
            messagingSenderId: "483484047694",
            appId: "1:483484047694:web:a2ae027087971638d6e61f",
            measurementId: "G-E9J7NT6JG5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CatGallery = () => {
            const colors = { black: "#333333", white: "#FFFFFF", orange: "#E89D45", grey: "#888888", ink: "#1A1A1A" };
            return (
                <div className="mt-8 border-t border-dashed border-[#1A1A1A]/20 pt-6 pb-4">
                    <div className="text-center text-[10px] font-bold text-[#1A1A1A]/40 mb-6 tracking-widest uppercase">LUCKY CAT CAT</div>
                    <div className="grid grid-cols-3 gap-y-6 gap-x-1 px-1 justify-items-center">
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M25,65 Q25,35 50,35 T75,65" fill={colors.black} /><circle cx="43" cy="50" r="1.5" fill="white" /><circle cx="57" cy="50" r="1.5" fill="white" /><path d="M35,40 L30,20 L45,38 Z" fill={colors.black} /><path d="M65,40 L70,20 L55,38 Z" fill={colors.black} /></svg></div>
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M20,65 Q20,35 50,35 T80,65" fill={colors.white} /><path d="M65,35 Q75,35 85,55 L80,65 L50,65 Z" fill={colors.orange} /><path d="M30,35 L25,15 L45,35" fill={colors.black} /><path d="M55,38 L60,18 L65,36 Z" fill={colors.orange} /><circle cx="40" cy="52" r="1.5" fill={colors.ink} /><circle cx="60" cy="52" r="1.5" fill={colors.ink} /></svg></div>
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M15,65 Q35,45 50,45 T85,65" fill={colors.white} /><path d="M35,48 L32,30 L45,46 Z" fill={colors.white} /><path d="M65,48 L68,30 L55,46 Z" fill={colors.white} /><circle cx="38" cy="53" r="1" fill={colors.ink} /><circle cx="62" cy="53" r="1" fill={colors.ink} /></svg></div>
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M25,65 Q25,40 50,40 T75,65" fill={colors.black} /><circle cx="50" cy="55" r="4" fill="white" /><path d="M35,45 L30,25 L45,43 Z" fill={colors.black} /><path d="M65,45 L70,25 L55,43 Z" fill={colors.black} /></svg></div>
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M25,65 Q25,40 50,40 T75,65" fill={colors.grey} /><path d="M30,50 L20,25 L80,25 L70,50 Z" fill="rgba(255,255,255,0.4)" stroke={colors.ink} strokeWidth="0.5" /><path d="M45,50 L40,35 L55,50 Z" fill={colors.grey} /></svg></div>
                        <div className="cat-item-box"><svg viewBox="0 0 100 80" preserveAspectRatio="xMidYMid meet" className="cat-svg-core"><path d="M25,65 Q25,40 50,40 T75,65" fill={colors.orange} /><path d="M35,45 L30,25 L45,43 Z" fill={colors.orange} /><circle cx="43" cy="55" r="1.5" fill={colors.ink} /><circle cx="57" cy="55" r="1.5" fill={colors.ink} /></svg></div>
                    </div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('calendar');
            const [user, setUser] = useState(null);
            const [syncStatus, setSyncStatus] = useState('connecting'); 
            const [errorMsg, setErrorMsg] = useState('');
            const ROOM_ID = "LUCKY_PIG_SYNC_ROOM_FINAL"; 
            const [entries, setEntries] = useState({});
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState('');

            useEffect(() => {
                signInAnonymously(auth).catch(err => {
                    setSyncStatus('error');
                    setErrorMsg(err.message);
                });
                onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if(u) setSyncStatus('linked');
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const docRef = doc(db, 'shared_diaries', ROOM_ID);
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setEntries(docSnap.data().entries || {});
                    }
                }, (err) => {
                    setSyncStatus('error');
                    setErrorMsg("Firestore: " + err.message);
                });
                return () => unsubscribe();
            }, [user]);

            const handleSave = async (data) => {
                const newEntries = { ...entries, [selectedDate]: data };
                setEntries(newEntries);
                if (user) {
                    try { await setDoc(doc(db, 'shared_diaries', ROOM_ID), { entries: newEntries }, { merge: true }); }
                    catch (e) { setSyncStatus('error'); setErrorMsg(e.message); }
                }
            };

            return (
                <div className="min-h-screen p-3 flex justify-center selection:bg-[#FCF5CA] relative">
                    <div className="noise-overlay" />
                    <div className="w-full max-w-lg bg-[#B4E082] hand-drawn-container p-5 flex flex-col min-h-[92vh] relative overflow-hidden">
                        <header className="flex justify-between items-start mb-6">
                            <div className="flex items-center gap-2">
                                <div className="bg-[#1A1A1A] p-1.5 rounded-full text-white">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                                </div>
                                <div>
                                    <span className="text-[10px] font-bold uppercase opacity-40 block tracking-widest">LUCKY PIG PIG</span>
                                    <h1 className="text-xl font-bold">今日小確幸</h1>
                                </div>
                            </div>
                            <button 
                                onClick={() => errorMsg && alert(errorMsg)}
                                className={`px-3 py-1 text-[9px] font-bold rounded-full border-2 border-[#1A1A1A] shadow-[2px_2px_0px_#1A1A1A] ${syncStatus === 'linked' ? 'bg-[#FCF5CA]' : 'bg-red-100'}`}
                            >
                                {syncStatus === 'linked' ? '● 自動同步中' : '連線異常'}
                            </button>
                        </header>
                        <main className="flex-1 overflow-y-auto custom-scroll pr-1">
                            {view === 'calendar' ? (
                                <div className="animate-fade-in px-1 text-center">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-lg font-bold">{currentDate.getFullYear()} / {currentDate.getMonth()+1}月</h2>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1))} className="p-2 bg-white border-2 border-[#1A1A1A] rounded-full shadow-[2px_2px_0px_#1A1A1A] active:translate-y-0.5"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
                                            <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1))} className="p-2 bg-white border-2 border-[#1A1A1A] rounded-full shadow-[2px_2px_0px_#1A1A1A] active:translate-y-0.5"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-2 mb-8">
                                        {['日','一','二','三','四','五','六'].map(d => <div key={d} className="text-center text-[10px] font-bold opacity-40">{d}</div>)}
                                        {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay() }).map((_, i) => <div key={i} />)}
                                        {Array.from({ length: new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate() }).map((_, i) => {
                                            const d = i + 1;
                                            const ds = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                                            const hasData = entries[ds] && (entries[ds].shushu?.some(v => v.trim()) || entries[ds].gaogao?.some(v => v.trim()));
                                            return <button key={d} onClick={() => { setSelectedDate(ds); setView('entry'); }} className={`aspect-square rounded-xl border-2 border-[#1A1A1A] font-bold text-sm shadow-[2px_2px_0px_#1A1A1A] active:translate-y-0.5 ${hasData ? 'bg-[#1A1A1A] text-white' : 'bg-white/40'}`}>{d}</button>;
                                        })}
                                    </div>
                                    <span className="text-[10px] font-bold opacity-30 italic">樹樹與高高專屬同步日記 (v1.2.0)</span>
                                </div>
                            ) : (
                                <div className="animate-fade-in">
                                    <button onClick={() => setView('calendar')} className="flex items-center gap-1 text-sm font-bold opacity-60 mb-4"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 返回月曆</button>
                                    <div className="mb-4">
                                        <div className="inline-block bg-white px-2 py-0.5 rounded border border-[#1A1A1A] text-[10px] font-bold mb-2 shadow-[1px_1px_0px_#1A1A1A]">{selectedDate.replace(/-/g, '.')}</div>
                                        <h2 className="text-lg font-bold">今天感恩的 3 件事：</h2>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        <div>
                                            <div className="text-center font-bold text-[13px] opacity-60 mb-2">🌲 樹樹</div>
                                            {[0, 1, 2].map(i => <textarea key={i} value={entries[selectedDate]?.shushu?.[i] || ''} onChange={(e) => { const ne = { ...entries }; if (!ne[selectedDate]) ne[selectedDate] = { shushu:['','',''], gaogao:['','',''] }; ne[selectedDate].shushu[i] = e.target.value; setEntries(ne); }} placeholder="記錄一點小確幸～" className="w-full bg-white rounded-xl p-2.5 text-[11px] min-h-[85px] mb-3 textarea-shadow focus:outline-none" />)}
                                        </div>
                                        <div>
                                            <div className="text-center font-bold text-[13px] opacity-60 mb-2">☁️ 高高</div>
                                            {[0, 1, 2].map(i => <textarea key={i} value={entries[selectedDate]?.gaogao?.[i] || ''} onChange={(e) => { const ne = { ...entries }; if (!ne[selectedDate]) ne[selectedDate] = { shushu:['','',''], gaogao:['','',''] }; ne[selectedDate].gaogao[i] = e.target.value; setEntries(ne); }} placeholder="記錄一點小確幸～" className="w-full bg-white rounded-xl p-2.5 text-[11px] min-h-[85px] mb-3 textarea-shadow focus:outline-none" />)}
                                        </div>
                                    </div>
                                    <button onClick={() => handleSave(entries[selectedDate])} className="w-full py-4 bg-[#DDF0C5] border-2 border-[#1A1A1A] rounded-xl font-bold flex items-center justify-center gap-2 shadow-[4px_4px_0px_#1A1A1A] active:translate-y-1 transition-all mb-8 text-sm text-[#1A1A1A]"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 儲存 3 份小確幸</button>
                                    <CatGallery />
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
